<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UIRPG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2314110e' width='16' height='16'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="shell">
    <header id="topbar">
      <h1>UIRPG</h1>
      <span id="who"></span>
    </header>
    <div id="stage-wrap">
      <aside id="sheet" hidden></aside>
      <main id="stage"></main>
    </div>
    <footer id="tray" class="closed">
      <div id="dice"></div>
      <div id="chronicle"></div>
    </footer>
  </div>
  <div id="modal" class="hidden" role="dialog" aria-modal="true"><div id="modal-content"></div></div>
  <script src="src/game/core.js"></script>
  <script src="src/game/utils.js"></script>
  <script src="src/game/events.js"></script>
  <script src="src/game/state.js"></script>
  <script src="src/config.js"></script>
  <script src="src/game/story/dice.js"></script>
  <script src="src/game/story/sheet.js"></script>
  <script src="src/game/story/balance.js"></script>
  <script src="src/game/story/content.js"></script>
  <script src="src/game/story/meta.js"></script>
  <script src="src/game/story/floors.js"></script>
  <script src="src/game/story/battle.js"></script>
  <script src="src/game/story/run.js"></script>
  <script src="src/ui/modal.js"></script>
  <script src="src/ui/content.js"></script>
  <script src="src/ui/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
